[tools]
node = "22"
pnpm = "latest"

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'npx corepack enable'

[env]
_.path = ['./node_modules/.bin']

[tasks.pnpm-install]
description = 'Installs dependencies with pnpm'
run = 'pnpm install'
sources = ['package.json', 'pnpm-lock.yaml', 'mise.toml']
outputs = ['node_modules/.pnpm/lock.yaml']

[tasks.lint]
description = 'Runs ESLint on the project'
run = 'pnpm lint'

[tasks.dev]
description = 'Calls your dev script in `package.json`'
run = 'pnpm dev'
alias = "d"
wait_for = ['pnpm-install']
depends = ['pnpm-install']

[tasks.pnpm-update]
description = 'Self-updates pnpm'
run = 'corepack use pnpm@latest'

[tasks.taze]
description = 'Interactively update outdated packages'
run = 'pnpm dlx taze patch --interactive'
alias = "outdated"

[tasks.rm-next]
description = 'Cleans up the .next directory'
run = 'pnpm dlx shx rm -rf .next'

[tasks.rm-node-modules]
description = "Cleans up the node_modules directory"
run = 'pnpm dlx shx rm -rf ./node_modules'

[tasks.upgrade-next]
description = 'Upgrades the Next.js version using @next/codemod'
run = 'pnpm upgrade-next'
